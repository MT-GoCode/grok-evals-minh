[project]
name = "grok-evals"
version = "0.1.0"
description = "Eval harness for Grok 4.3: TutorBench (in-house) + MatSciBench (vendored)."
requires-python = ">=3.12,<3.14"
dependencies = [
    "openai>=1.50",
    "anthropic>=0.40",
    "datasets>=3.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "pillow>=10.0",
    "httpx>=0.27",
    "tenacity>=8.5",
    "pandas>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grok_evals"]
